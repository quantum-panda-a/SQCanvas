[project]
name = "qcanvas"
version = "0.1.0"
description = "Superconducting Qubit Layout Design Framework"
readme = "README.md"
authors = [
    { name = "Xander Parker", email = "pandapeppa2026@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "shapely>=2.0.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "gdstk>=0.9.0",
    "PySide6>=6.6.0",
]

[project.optional-dependencies]
notebook = [
    "ipython>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
